<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>Tabloom</h1>
      <p>Keep track of shared expenses</p>
    </header>
    
    <section class="summary">
      <h2>Outstanding</h2> 
      <p id="outstanding-total">$0.00</p>
    </section>

    <section class="add-expense">
      <h2>Add an expense</h2> 

      <form id="expense-form">
        <label for="description">Description</label>
        <input type="text" id="description" name="description" maxlength="100" required>

        <label for="paid_by">Paid by</label>
        <input type="text" id="paid_by" name="paid_by" maxlength="50" required>

        <label for="owed_by">Owed by</label>
        <input type="text" id="owed_by" name="owed_by" maxlength="50" required>

        <label for="amount">Amount</label>
        <input type="number" id="amount" name="amount" min="0.01" step="0.01" required>

        <label for="date">Date</label>
        <input type="date" id="date" name="date" required>

        <button type="submit">Add expense</button>
        <p id="form-message" role="status"></p> 
      </form>
    </section>

    <section class="expense-history">
      <h2>Expenses</h2> 

      <div id="expenses-list">
        <p>Loading expenses...</p>
      </div>
    </section>
  </main>
</body>
</html>
